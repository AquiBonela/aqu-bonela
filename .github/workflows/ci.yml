name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sin proyectos ni claves de Supabase escritos en el código
        # Cada instalación toma su Supabase de variables de entorno. Solo se listan nombres de archivo.
        run: |
          if git grep -l -E 'https://[a-z0-9]{20}\.supabase\.co|sb_(publishable|secret)_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{30,}\.' -- src; then
            echo "::error::Hay una URL o clave de Supabase escrita en src/. Debe leerse de las variables de entorno."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Instalar dependencias (lockfile congelado)
        run: bun install --frozen-lockfile
      - name: Pruebas
        run: bun run test
      - name: Build
        run: bun run build
        env:
          # Valores ficticios: el build no se conecta a ningún Supabase real.
          VITE_MUNICIPALITY_ID: casarabonela
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: Comprobación de tipos
        run: bunx tsc --noEmit
      - name: Selección de instancia en el build
        # Con una sola instancia no se notaría si "@instance" dejara de depender de la variable:
        # se compila una copia temporal con una marca única, que no se versiona.
        run: |
          set -euo pipefail
          marca="marca-instancia-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp -r instances/casarabonela instances/zz-prueba
          sed -i "s/id: \"casarabonela\"/id: \"zz-prueba\"/; s/appName: \"Aquí Bonela\"/appName: \"$marca\"/" instances/zz-prueba/config.ts
          grep -q "$marca" instances/zz-prueba/config.ts
          echo "$marca" > instances/zz-prueba/public/marca-publica.txt
          VITE_MUNICIPALITY_ID=zz-prueba bun run build
          # Los archivos de instances/<id>/public deben llegar a la salida del build.
          if ! grep -r -q -x -F "$marca" . --include=marca-publica.txt --exclude-dir=node_modules --exclude-dir=instances --exclude-dir=.git; then
            echo "::error::El build no copió los archivos públicos de la instancia."
            exit 1
          fi
          if ! grep -r -q "$marca" . --exclude-dir=node_modules --exclude-dir=instances --exclude-dir=.git; then
            echo "::error::El build no usó la instancia indicada en VITE_MUNICIPALITY_ID."
            exit 1
          fi
          rm -rf instances/zz-prueba
          if VITE_MUNICIPALITY_ID=no-existe bun run build > build-no-existe.log 2>&1; then
            echo "::error::Un identificador inexistente no hizo fallar el build."
            exit 1
          fi
          grep -q 'no existe la instancia "no-existe"' build-no-existe.log || { cat build-no-existe.log; exit 1; }
      - name: Demo sin datos del municipio piloto
        # Compila la demo como servidor Node, la arranca con un Supabase simulado
        # (listas vacías, sin base real) y busca términos del piloto en sus páginas.
        run: |
          bun run build
          node scripts/check-demo-leaks.mjs
        env:
          VITE_MUNICIPALITY_ID: demo
          NITRO_PRESET: node-server
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          RATE_LIMIT_SECRET: ci-placeholder-not-a-secret-ci-placeholder
          TURNSTILE_SITE_KEY: ci-placeholder

  lint:
    name: Lint (informativo, no bloquea)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hoy el lint falla por formato (Prettier) en muchos archivos. Se deja
    # informativo hasta formatear el repo en un cambio aparte; después, quitar
    # la línea siguiente para que bloquee.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
